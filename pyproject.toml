[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-pixeltable"
version = "0.1.0"
description = "Pydantic AI Harness MemoryStore backed by Pixeltable."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Pixeltable", email = "contact@pixeltable.com" },
]
keywords = ["pydantic-ai", "pydantic-ai-harness", "pixeltable", "memory", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic-ai-harness>=0.29.0",
    "pixeltable>=0.6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/pixeltable/pydantic-ai-pixeltable"
Repository = "https://github.com/pixeltable/pydantic-ai-pixeltable"
Documentation = "https://docs.pixeltable.com/libraries/pydantic-ai"
Issues = "https://github.com/pixeltable/pydantic-ai-pixeltable/issues"
Discord = "https://discord.gg/QPyqFYx2UN"

[tool.setuptools.packages.find]
include = ["pydantic_ai_pixeltable*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
