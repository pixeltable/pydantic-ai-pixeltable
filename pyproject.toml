[build-system]
requires = ["setuptools>=77.0.3"]  # PEP 639 license metadata floor
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-pixeltable"
version = "0.1.0"
description = "Pydantic AI Harness MemoryStore and Pixeltable catalog tools."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Pixeltable", email = "contact@pixeltable.com" },
]
keywords = ["pydantic-ai", "pydantic-ai-harness", "pixeltable", "memory", "rag", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic-ai-slim>=2.0",
    "pydantic-ai-harness>=0.29.0",
    "pixeltable>=0.6.8",
]

[project.optional-dependencies]
dev = [
    "mistune>=3.0.2,<4",  # pixeltable lazily requires it to parse .md pxt.Document values in tests
    "numpy",  # tests embed vectors; only transitive via pixeltable otherwise
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/pixeltable/pydantic-ai-pixeltable"
Repository = "https://github.com/pixeltable/pydantic-ai-pixeltable"
Documentation = "https://github.com/pixeltable/pydantic-ai-pixeltable#readme"
Issues = "https://github.com/pixeltable/pydantic-ai-pixeltable/issues"
Discord = "https://discord.gg/QPyqFYx2UN"

[tool.setuptools.packages.find]
include = ["pydantic_ai_pixeltable*"]

[tool.setuptools.package-data]
pydantic_ai_pixeltable = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-m not expensive",
]
markers = [
    "expensive: long-running local volume tests",
]
xfail_strict = true
