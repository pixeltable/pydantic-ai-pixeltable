name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8  # match .pre-commit-config.yaml
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    # The package ships py.typed; the test suite is not in scope (pixeltable
    # stubs flag ColumnSpec dicts heavily there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy pydantic_ai_pixeltable

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  floor:
    # Declared minimums: Python 3.11, pixeltable 0.7.8, pydantic-ai-harness 0.29.0, pydantic-ai-slim 2.38.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" "pixeltable==0.7.8" "pydantic-ai-harness==0.29.0" "pydantic-ai-slim==2.38.0"
      - run: pytest tests/ -v

  expensive:
    # ~20k-row volume tests; too slow for every push.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_stress.py -v -m expensive
